<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Burnrate</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d1117;--surface:#161b22;--border:#30363d;
    --text:#c9d1d9;--text-dim:#8b949e;--accent:#58a6ff;
  }
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text)}
  body{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px}

  .logo{font-size:28px;font-weight:700;letter-spacing:-0.5px}
  .status{font-size:14px;color:var(--text-dim)}

  .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .error{color:#f85149;font-size:13px;max-width:400px;text-align:center;line-height:1.5}
  .retry-btn{margin-top:8px;padding:6px 16px;border:1px solid var(--border);border-radius:6px;
    background:var(--surface);color:var(--text);cursor:pointer;font-size:13px}
  .retry-btn:hover{border-color:var(--text-dim)}
</style>
</head>
<body>
  <div class="logo">burnrate</div>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">Starting daemon...</div>
  <div class="error" id="error" style="display:none"></div>
  <button class="retry-btn" id="retry" style="display:none" onclick="location.reload()">Retry</button>

<script>
(function() {
  var statusEl = document.getElementById('status');
  var errorEl = document.getElementById('error');
  var spinnerEl = document.getElementById('spinner');
  var retryEl = document.getElementById('retry');
  var attempt = 0;
  var maxAttempts = 60;

  function checkHealth() {
    attempt++;
    if (attempt > maxAttempts) {
      spinnerEl.style.display = 'none';
      statusEl.style.display = 'none';
      errorEl.style.display = 'block';
      errorEl.textContent = 'Could not connect to the burnrate daemon. Make sure the Go binary is built (go build -o burnrate ./cmd/burnrate) and accessible.';
      retryEl.style.display = 'inline-block';
      return;
    }

    if (attempt > 4) {
      statusEl.textContent = 'Waiting for daemon... (' + attempt + 's)';
    }

    fetch('http://127.0.0.1:9112/health')
      .then(function(r) {
        if (r.ok) {
          statusEl.textContent = 'Connected!';
          // The Rust backend navigates us; if it hasn't after 2s, do it ourselves.
          setTimeout(function() {
            window.location.href = 'http://127.0.0.1:9112';
          }, 2000);
        } else {
          setTimeout(checkHealth, 500);
        }
      })
      .catch(function() {
        setTimeout(checkHealth, 500);
      });
  }

  // Start checking after a brief delay to let the sidecar start.
  setTimeout(checkHealth, 1000);
})();
</script>
</body>
</html>
